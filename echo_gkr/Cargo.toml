[package]
name = "echo_gkr"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[dependencies]
echo_core = { path = "../echo_core" }
echo_poseidon2b = { path = "../echo_poseidon2b" }
echo_fri = { path = "../echo_fri" }
echo_fri_binius = { path = "../echo_fri_binius" }
echo_tx = { path = "../echo_tx" }
rayon = "1.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
rand = "0.8"
bincode = "1"
hex = "0.4"
static_assertions = "1.1"
