[package]
name        = "echo-extminer"
version.workspace = true
edition     = "2021"
license     = "Apache-2.0"
description = "External Poseidon2b PoW miner for ParanO(1)d"
default-run = "lostecho-miner"

[[bin]]
name = "lostecho-miner"
path = "src/main.rs"

[dependencies]
# PoW hashing
echo_core      = { path = "../echo_core" }
echo_poseidon2b = { path = "../echo_poseidon2b" }
rayon      = "1"

# HTTP / JSON-RPC
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde      = { version = "1",    features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Misc
hex    = "0.4"
anyhow = "1"
libc   = "0.2"

[dev-dependencies]
tempfile = "3"
