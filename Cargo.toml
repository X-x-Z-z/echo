[workspace]
members = [
    "bench_prover",
    "echo_core",
    "echo_fri",
    "echo_fri_binius",
    "echo_poseidon2b",
    "echo_ivc_core",
    "echo_ivc_prover",
    "echo_tx",
    "echo_chain",
    "echo_gkr",
    "echo_block",
    "echo_recursive",
    "echo_soundness",
    # Node Infrastructure
    "echo_mempool",
    "echo_miner",
    "echo_p2p",
    "echo_rpc",
    "echo_node",
    "echo_gui",
    # External tools
    "echo_extminer",
]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"

# HistoryStep is dominated by two large cross-crate prover phases. Thin LTO
# plus one codegen unit removes cross-crate abstraction and codegen overhead.
# This changes executable code only; proof relations and frozen matrix bytes
# remain identical.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
