[package]
name = "echo_rpc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
echo_chain      = { path = "../echo_chain" }
echo_tx         = { path = "../echo_tx" }
echo_poseidon2b = { path = "../echo_poseidon2b" }
echo_mempool    = { path = "../echo_mempool" }
echo_miner      = { path = "../echo_miner" }
echo_p2p        = { path = "../echo_p2p" }
echo_recursive  = { path = "../echo_recursive" }
jsonrpsee    = { version = "0.24", features = ["server", "macros"] }
tower        = { version = "0.4", features = ["util"] }
http         = "1"
blake3       = "1"
subtle       = "2"
zeroize      = "1"
tokio        = { workspace = true }
tracing      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }

hex          = "0.4"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
